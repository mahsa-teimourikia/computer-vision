<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 680" role="img" aria-labelledby="title description">
<title id="title">Pre-normalized transformer encoder block</title>
<desc id="description">Input tokens pass through layer normalization and multi-head self-attention, then are added to the first residual path. A second layer normalization and token-wise MLP feed another residual addition.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1700" height="680" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Pre-normalized transformer encoder block</text>
<rect x="50" y="100" width="1600" height="500" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">ONE PRE-NORM ENCODER BLOCK</text>
<polyline points="240,264 270,264 270,265 310,265" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="460,265 530,265 530,260" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="700,260 735,260 735,258 770,258" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="165,335 165,450 848,450 848,335" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="442" y="428" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="500" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">identity</text>
<polyline points="925,280 960,280 960,265 1000,265" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1150,265 1220,265 1220,260" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1400,260 1435,260 1435,258 1470,258" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="886,335 886,520 1542,520 1542,335" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="1132" y="498" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1190" y="515" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">identity</text>
<rect x="90" y="225" width="150" height="110" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="165.0" y="259" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Tokens X</text>
<text x="165.0" y="287" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">B × N × D</text>
<rect x="310" y="210" width="150" height="110" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="385.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">LayerNorm</text>
<text x="385.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pre-norm</text>
<rect x="530" y="195" width="170" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="615.0" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Multi-head</text>
<text x="615.0" y="251" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">attention</text>
<text x="615.0" y="279" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">mix tokens</text>
<rect x="770" y="225" width="155" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="847.5" y="259" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Residual add</text>
<text x="847.5" y="287" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">X′ = X + MHA</text>
<rect x="1000" y="210" width="150" height="110" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="1075.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">LayerNorm</text>
<text x="1075.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pre-norm</text>
<rect x="1220" y="195" width="180" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1310.0" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Token-wise MLP</text>
<text x="1310.0" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">expand · GELU · project</text>
<rect x="1470" y="225" width="145" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1542.5" y="259" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Residual add</text>
<text x="1542.5" y="287" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">Y = X′ + MLP</text>
</svg>
