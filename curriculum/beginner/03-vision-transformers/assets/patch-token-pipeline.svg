<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
<title id="title">From image grid to transformer decision</title>
<desc id="description">An image is divided into non-overlapping patches, linearly projected into tokens, combined with position information, mixed by transformer encoder blocks, pooled into a representation, and classified.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="520" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">From image grid to transformer decision</text>
<rect x="50" y="100" width="1500" height="350" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">VISION TRANSFORMER DATA FLOW</text>
<polyline points="270,275 340,275" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="520,275 590,275" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="770,275 840,275" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,275 1090,275" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1270,275 1340,275" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="220" width="180" height="110" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="180.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image grid</text>
<text x="180.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">B × C × H × W</text>
<rect x="340" y="220" width="180" height="110" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="430.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Patch + project</text>
<text x="430.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">N patches → D dims</text>
<rect x="590" y="220" width="180" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="680.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Add position</text>
<text x="680.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">and optional CLS token</text>
<rect x="840" y="220" width="180" height="110" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="930.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Encoder blocks</text>
<text x="930.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">attention + MLP</text>
<rect x="1090" y="220" width="180" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1180.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Representation</text>
<text x="1180.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">CLS or mean pool</text>
<rect x="1340" y="220" width="170" height="110" rx="16" fill="#EAF7EA" stroke="#3D9B55" stroke-width="2" filter="url(#shadow)"/>
<text x="1425.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Task head</text>
<text x="1425.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">measured decision</text>
</svg>
