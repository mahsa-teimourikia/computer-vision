<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 720" role="img" aria-labelledby="title description">
<title id="title">Scaled dot-product attention: match, normalize, and mix</title>
<desc id="description">Token embeddings fan out into query, key, and value projections. Queries and keys form scaled pairwise scores, softmax normalizes each query row, and the weights mix values into output tokens.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1700" height="720" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Scaled dot-product attention: match, normalize, and mix</text>
<rect x="50" y="100" width="1600" height="550" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">ONE ATTENTION HEAD · BATCH DIMENSION OMITTED</text>
<polyline points="250,317 290,317 290,205 340,205" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="250,350 295,350 295,360 340,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="250,383 290,383 290,515 340,515" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,205 565,205 565,264 620,264" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,360 565,360 565,310 620,310" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="810,288 900,288" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1080,288 1120,288 1120,404 1170,404" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,515 1110,515 1110,456 1170,456" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1370,428 1470,428" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="295" width="160" height="110" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="170.0" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Tokens X</text>
<text x="170.0" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">N × D</text>
<rect x="340" y="155" width="170" height="100" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="425.0" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Queries Q</text>
<text x="425.0" y="217" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">XWQ · N × dₖ</text>
<rect x="340" y="310" width="170" height="100" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="425.0" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Keys K</text>
<text x="425.0" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">XWK · N × dₖ</text>
<rect x="340" y="465" width="170" height="100" rx="16" fill="#EAF7EA" stroke="#3D9B55" stroke-width="2" filter="url(#shadow)"/>
<text x="425.0" y="499" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Values V</text>
<text x="425.0" y="527" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">XWV · N × dᵥ</text>
<rect x="620" y="230" width="190" height="115" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="715.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pairwise scores</text>
<text x="715.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">QKᵀ / √dₖ · N × N</text>
<rect x="900" y="230" width="180" height="115" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="990.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Row softmax</text>
<text x="990.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">weights A · N × N</text>
<rect x="1170" y="370" width="200" height="115" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1270.0" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Weighted values</text>
<text x="1270.0" y="432" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">AV · N × dᵥ</text>
<rect x="1470" y="370" width="150" height="115" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1545.0" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Output tokens</text>
<text x="1545.0" y="432" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">N × dᵥ</text>
</svg>
