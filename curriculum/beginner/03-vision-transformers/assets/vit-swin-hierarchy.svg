<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
<title id="title">Flat ViT and hierarchical Swin</title>
<desc id="description">A flat Vision Transformer keeps a 14 by 14 token grid through global attention blocks. Swin begins with a finer grid, applies local and shifted windows, and repeatedly merges patches to build four hierarchical feature stages.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="760" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Flat ViT and hierarchical Swin</text>
<rect x="50" y="110" width="650" height="580" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">FLAT ViT · ONE TOKEN SCALE</text>
<rect x="800" y="110" width="750" height="580" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="822" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">SWIN · HIERARCHICAL WINDOWS</text>
<polyline points="240,340 270,340 270,330 300,330" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="470,330 530,330" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="970,328 1015,328" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1145,328 1190,328" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1320,328 1365,328" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="285" width="150" height="110" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="165.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Patch embed</text>
<text x="165.0" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">14 × 14 × D</text>
<rect x="300" y="265" width="170" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="385.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Global attention</text>
<text x="385.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">196 × 196 per head</text>
<rect x="530" y="265" width="140" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Repeat blocks</text>
<text x="600.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">grid stays 14 × 14</text>
<rect x="840" y="265" width="130" height="125" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="905.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Stage 1</text>
<text x="905.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">windows · H/4</text>
<rect x="1015" y="265" width="130" height="125" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1080.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Stage 2</text>
<text x="1080.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">shift + merge · H/8</text>
<rect x="1190" y="265" width="130" height="125" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1255.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Stage 3</text>
<text x="1255.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">shift + merge · H/16</text>
<rect x="1365" y="265" width="150" height="125" rx="16" fill="#EAF7EA" stroke="#3D9B55" stroke-width="2" filter="url(#shadow)"/>
<text x="1440.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Stage 4</text>
<text x="1440.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">merge · H/32</text>
</svg>
