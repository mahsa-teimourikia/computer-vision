<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-labelledby="title description">
<title id="title">Three visual backbones, three mixing strategies</title>
<desc id="description">Three columns compare a hierarchical CNN using shared local convolution, a flat Vision Transformer using global content-dependent attention, and Swin using local shifted-window attention with patch-merging stages.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1500" height="840" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Three visual backbones, three mixing strategies</text>
<rect x="50" y="110" width="430" height="660" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">HIERARCHICAL CNN</text>
<rect x="535" y="110" width="430" height="660" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="557" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">FLAT ViT</text>
<rect x="1020" y="110" width="430" height="660" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1042" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">HIERARCHICAL SWIN</text>
<polyline points="265,300 265,365" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="265,485 265,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="750,300 750,365" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="750,485 750,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1235,300 1235,365" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1235,485 1235,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="105" y="180" width="320" height="120" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="265.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Shared convolution</text>
<text x="265.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">local, content-independent weights</text>
<rect x="105" y="365" width="320" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="265.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Strong spatial bias</text>
<text x="265.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">locality + weight sharing</text>
<rect x="105" y="550" width="320" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="265.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Mature kernels</text>
<text x="265.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">hierarchy · target profiling</text>
<rect x="590" y="180" width="320" height="120" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="750.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Global attention</text>
<text x="750.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">content-dependent token mixing</text>
<rect x="590" y="365" width="320" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="750.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Weaker spatial bias</text>
<text x="750.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">explicit positions · one scale</text>
<rect x="590" y="550" width="320" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="750.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Quadratic interactions</text>
<text x="750.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">token budget drives cost</text>
<rect x="1075" y="180" width="320" height="120" rx="16" fill="#E8F2FF" stroke="#2878C8" stroke-width="2" filter="url(#shadow)"/>
<text x="1235.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Shifted windows</text>
<text x="1235.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">local content-dependent mixing</text>
<rect x="1075" y="365" width="320" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1235.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Local + hierarchical</text>
<text x="1235.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">window bias + patch merging</text>
<rect x="1075" y="550" width="320" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1235.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Near-linear window cost</text>
<text x="1235.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">operator support still matters</text>
</svg>
