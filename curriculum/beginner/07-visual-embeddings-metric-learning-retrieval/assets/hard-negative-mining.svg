<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 740" role="img" aria-labelledby="title description">
<title id="title">Reviewed hard-negative mining loop</title>
<desc id="description">A loop embeds the training corpus, retrieves nearest wrong-label examples, reviews false negatives, trains on approved triplets, and returns to the corpus.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1700" height="740" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Reviewed hard-negative mining loop</text>
<rect x="64" y="100" width="1572" height="576" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Visual retrieval system</text>
<polyline points="320,355 400,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,355 700,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="930,355 1010,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1260,355 1350,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1247" y="323" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1305" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">approved</text>
<polyline points="1475,420 1475,570 210,570 210,420" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="787" y="538" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="845" y="555" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">repeat with versioned encoder</text>
<rect x="100" y="290" width="220" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="210.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Training corpus</text>
<text x="210.0" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">labels · groups · sources</text>
<rect x="400" y="290" width="220" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="510.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Embed corpus</text>
<text x="510.0" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">current encoder</text>
<rect x="700" y="290" width="230" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="815.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Mine neighbours</text>
<text x="815.0" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">nearest wrong label</text>
<rect x="1010" y="270" width="250" height="170" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1135.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Review candidate</text>
<text x="1135.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">hard · false · duplicate · shortcut</text>
<rect x="1350" y="290" width="250" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1475.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Train approved triplet</text>
<text x="1475.0" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">record active loss</text>
</svg>
