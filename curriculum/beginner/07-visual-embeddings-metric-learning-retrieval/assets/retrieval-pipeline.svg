<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 740" role="img" aria-labelledby="title description">
<title id="title">Production query-by-example pipeline</title>
<desc id="description">A query region moves through a versioned encoder and index, then authorization and metadata filters, ranking, and evidence results.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="740" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Production query-by-example pipeline</text>
<rect x="64" y="100" width="1672" height="576" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Visual retrieval system</text>
<polyline points="340,355 420,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,355 770,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="667" y="323" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="725" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">search</text>
<polyline points="1020,355 1110,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1007" y="323" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1065" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">candidates</text>
<polyline points="1380,355 1470,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1367" y="323" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1425" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">rank + fetch</text>
<rect x="100" y="290" width="240" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="220.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Query image / region</text>
<rect x="420" y="270" width="260" height="170" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="550.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Encoder + preprocess</text>
<text x="550.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">model · revision · normalization</text>
<rect x="770" y="270" width="250" height="170" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="895.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Vector index</text>
<text x="895.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">vectors · IDs · index version</text>
<rect x="1110" y="270" width="270" height="170" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1245.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Authorization + filters</text>
<text x="1245.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">tenant · source · time · family</text>
<rect x="1470" y="290" width="240" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1590.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Ranked evidence</text>
<text x="1590.0" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">scores · provenance · review</text>
</svg>
