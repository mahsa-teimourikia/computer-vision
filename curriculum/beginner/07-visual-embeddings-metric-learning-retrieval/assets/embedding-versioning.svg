<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 820" role="img" aria-labelledby="title description">
<title id="title">Blue/green embedding index migration</title>
<desc id="description">A governed corpus feeds encoder and index version 1 for current traffic while version 2 is re-embedded, built, validated, switched, and later replaces version 1.</desc>
