<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title description">
<title id="title">Vision foundation capabilities</title>
<desc id="description">Broad pretraining creates reusable representations and promptable interfaces that support alignment, retrieval, localization, segmentation, adaptation, and composed systems, each with evaluation.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Vision foundation capabilities</text>
<rect x="64" y="100" width="1672" height="730" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Reusable system surface</text>
<polyline points="900,270 900,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="710,480 710,540 245,540 245,620" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="805,480 805,560 565,560 565,620" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="900,480 900,560 885,560 885,620" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="995,480 995,560 1205,560 1205,620" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1090,480 1090,540 1525,540 1525,620" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="690" y="150" width="420" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="900.0" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Broad pretraining</text>
<text x="900.0" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">scale · diversity · objective</text>
<rect x="650" y="350" width="500" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="900.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Foundation representation</text>
<text x="900.0" y="406" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">or promptable interface</text>
<rect x="120" y="620" width="250" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="245.0" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Retrieval</text>
<text x="245.0" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">rank</text>
<rect x="440" y="620" width="250" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="565.0" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Alignment</text>
<text x="565.0" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">image ↔ text</text>
<rect x="760" y="620" width="250" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="885.0" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Localization</text>
<text x="885.0" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">ground + box</text>
<rect x="1080" y="620" width="250" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1205.0" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Segmentation</text>
<text x="1205.0" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">prompt + mask</text>
<rect x="1400" y="620" width="250" height="120" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1525.0" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Adaptation</text>
<text x="1525.0" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">probe · adapter · tune</text>
</svg>
