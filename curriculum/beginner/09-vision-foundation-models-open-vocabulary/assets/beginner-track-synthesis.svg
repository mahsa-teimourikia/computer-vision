<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 650" role="img" aria-labelledby="title description">
<title id="title">Beginner track: from pixels to reusable capabilities</title>
<desc id="description">Nine connected course stages progress from pixels and encoders through tokens, self-supervision, detection, segmentation, retrieval, temporal state, and reusable foundation capabilities.</desc>
