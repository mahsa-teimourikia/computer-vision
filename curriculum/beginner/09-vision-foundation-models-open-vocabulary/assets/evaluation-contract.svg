<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 940" role="img" aria-labelledby="title description">
<title id="title">Capability-specific evaluation contract</title>
<desc id="description">A foundation system fans out to separate representation, language, localization, segmentation, composition, systems, and governance evaluation before a deployment decision.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2000" height="940" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Capability-specific evaluation contract</text>
<rect x="64" y="100" width="1872" height="770" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">No single foundation score</text>
<polyline points="790,280 790,360 210,360 210,470" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
