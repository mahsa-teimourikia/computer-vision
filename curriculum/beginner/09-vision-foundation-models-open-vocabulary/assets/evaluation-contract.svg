<text x="990.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">region · boundary</text>
<rect x="1130" y="470" width="240" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1250.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Composition</text>
<text x="1250.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">stage propagation</text>
<rect x="1390" y="470" width="240" height="130" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1510.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Systems</text>
<text x="1510.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">latency · memory</text>
<rect x="1650" y="470" width="240" height="130" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1770.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Governance</text>
<text x="1770.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">license · provenance</text>
<rect x="750" y="720" width="500" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1000.0" y="754" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Bounded deployment decision</text>
<text x="1000.0" y="782" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pass · abstain · review · reject</text>
