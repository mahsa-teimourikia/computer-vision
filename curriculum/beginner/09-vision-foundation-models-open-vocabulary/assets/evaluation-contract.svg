<polyline points="1000,280 1000,400 990,400 990,470" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1070,280 1070,400 1250,400 1250,470" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1140,280 1140,380 1510,380 1510,470" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1210,280 1210,360 1770,360 1770,470" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="210,600 210,660 1000,660 1000,720" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="1770,600 1770,680 1000,680 1000,720" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="750" y="150" width="500" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1000.0" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Foundation vision system</text>
<text x="1000.0" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">versioned model + prompts + composition</text>
<rect x="90" y="470" width="240" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="210.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Representation</text>
<text x="210.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">probe · retrieval · dense</text>
<rect x="350" y="470" width="240" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="470.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Language</text>
<text x="470.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">prompt · vocabulary</text>
<rect x="610" y="470" width="240" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="730.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Localization</text>
<text x="730.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">box · phrase</text>
