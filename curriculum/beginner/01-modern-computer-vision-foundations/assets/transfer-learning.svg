<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
<title id="title">Transfer learning is a spectrum of adaptation cost and flexibility</title>
<desc id="description">A pretrained encoder branches into frozen feature extraction, a trained task head, partial fine-tuning, and full fine-tuning with increasing compute and flexibility.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1200" height="740" fill="#F7FAFC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Transfer learning is a spectrum of adaptation cost and flexibility</text>
<rect x="50" y="120" width="500" height="540" rx="20" fill="#F8FBFF" stroke="#A8C7FA" stroke-width="2"/>
<text x="72" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">REUSABLE REPRESENTATION</text>
<rect x="590" y="120" width="560" height="540" rx="20" fill="#FBF9FF" stroke="#C9B8FF" stroke-width="2"/>
<text x="612" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">DOMAIN ADAPTATION OPTIONS</text>
<polyline points="280,295 320,295" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,295 570,295 570,212 650,212" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,295 570,295 570,342 650,342" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,295 570,295 570,472 650,472" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="510,295 570,295 570,595 650,595" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="235" width="190" height="120" rx="16" fill="#FFF7E6" stroke="#D9822B" stroke-width="2" filter="url(#shadow)"/>
<text x="185.0" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Large source dataset</text>
<text x="185.0" y="297" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">broad visual supervision</text>
<rect x="320" y="235" width="190" height="120" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="415.0" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pretrained encoder</text>
<text x="415.0" y="297" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">ResNet · ConvNeXt · ViT</text>
<rect x="650" y="165" width="430" height="95" rx="16" fill="#EAFBF3" stroke="#219653" stroke-width="2" filter="url(#shadow)"/>
<text x="865.0" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Frozen embedding + probe</text>
<text x="865.0" y="227" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">lowest cost · strong baseline</text>
<rect x="650" y="295" width="430" height="95" rx="16" fill="#EAFBF3" stroke="#219653" stroke-width="2" filter="url(#shadow)"/>
<text x="865.0" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Train a new task head</text>
<text x="865.0" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">encoder stays frozen</text>
<rect x="650" y="425" width="430" height="95" rx="16" fill="#F3EDFF" stroke="#7B61FF" stroke-width="2" filter="url(#shadow)"/>
<text x="865.0" y="459" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Fine-tune the final stage</text>
<text x="865.0" y="487" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">more flexibility · moderate risk</text>
<rect x="650" y="555" width="430" height="80" rx="16" fill="#F3EDFF" stroke="#7B61FF" stroke-width="2" filter="url(#shadow)"/>
<text x="865.0" y="589" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Fine-tune the full encoder</text>
<text x="865.0" y="617" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">highest cost · strongest data need</text>
</svg>
