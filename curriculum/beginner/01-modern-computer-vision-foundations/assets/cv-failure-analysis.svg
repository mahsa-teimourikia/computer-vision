<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
<title id="title">Failure analysis traces an error back to the system layer that created it</title>
<desc id="description">An observed error is traced through data, representation, shift, and decision-policy failure buckets before a targeted mitigation and retest.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1200" height="740" fill="#F7FAFC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Failure analysis traces an error back to the system layer that created it</text>
<rect x="50" y="100" width="250" height="220" rx="20" fill="#FFF9FA" stroke="#F0B7C2" stroke-width="2"/>
<text x="72" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">OBSERVE</text>
<rect x="340" y="100" width="810" height="420" rx="20" fill="#FFFCF7" stroke="#F0C99A" stroke-width="2"/>
<text x="362" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">DIAGNOSE BY SLICE</text>
<rect x="340" y="555" width="810" height="135" rx="20" fill="#F7FCF9" stroke="#A7D7BE" stroke-width="2"/>
<text x="362" y="589" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">MITIGATE AND VERIFY</text>
<polyline points="270,228 320,228 320,218 375,218" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="270,228 320,228 320,80 750,80 750,218 780,218" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="270,228 320,228 320,398 375,398" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="270,228 320,228 320,500 750,500 750,398 780,398" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="540,270 350,270 350,550 522,550 522,600" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="540,450 540,550 669,550 669,600" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="945,270 1130,270 1130,550 816,550 816,600" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="945,450 945,600 963,600" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="80" y="175" width="190" height="105" rx="16" fill="#FFF0F3" stroke="#D64562" stroke-width="2" filter="url(#shadow)"/>
<text x="175.0" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Observed error</text>
<text x="175.0" y="237" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">wrong · uncertain · late</text>
<rect x="375" y="165" width="330" height="105" rx="16" fill="#FFF7E6" stroke="#D9822B" stroke-width="2" filter="url(#shadow)"/>
<text x="540.0" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Data failure</text>
<text x="540.0" y="227" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">label · duplicate · shortcut</text>
<rect x="780" y="165" width="330" height="105" rx="16" fill="#FFF7E6" stroke="#D9822B" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Shift failure</text>
<text x="945.0" y="227" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">source · lighting · process</text>
<rect x="375" y="345" width="330" height="105" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="540.0" y="379" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Representation failure</text>
<text x="540.0" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">missed texture, shape, or context</text>
<rect x="780" y="345" width="330" height="105" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="379" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Decision-policy failure</text>
<text x="945.0" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">threshold · calibration · no abstain</text>
<rect x="375" y="600" width="735" height="70" rx="16" fill="#EAFBF3" stroke="#219653" stroke-width="2" filter="url(#shadow)"/>
<text x="742.5" y="634" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Targeted mitigation → rerun the same slices and stress tests</text>
<text x="742.5" y="662" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">change one layer, measure the trade-off, preserve the evidence</text>
</svg>
