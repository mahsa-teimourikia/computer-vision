<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
<title id="title">CNN layers trade spatial detail for semantic abstraction</title>
<desc id="description">A CNN hierarchy flows from pixels to edges and textures, parts, objects, and a task head while receptive field and semantic abstraction increase.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1200" height="620" fill="#F7FAFC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">CNN layers trade spatial detail for semantic abstraction</text>
<rect x="50" y="100" width="1100" height="420" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
<text x="72" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Receptive field and semantic abstraction increase →</text>
<polyline points="245,290 285,290" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="465,290 505,290" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="675,290 715,290" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="900,290 940,290" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="75" y="230" width="170" height="120" rx="16" fill="#FFF7E6" stroke="#D9822B" stroke-width="2" filter="url(#shadow)"/>
<text x="160.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pixels</text>
<text x="160.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">H × W × C</text>
<rect x="285" y="230" width="180" height="120" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="375.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Edges · textures</text>
<text x="375.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">local patterns</text>
<rect x="505" y="230" width="170" height="120" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="590.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Parts</text>
<text x="590.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">corners · motifs</text>
<rect x="715" y="230" width="185" height="120" rx="16" fill="#EAFBF3" stroke="#219653" stroke-width="2" filter="url(#shadow)"/>
<text x="807.5" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Objects · context</text>
<text x="807.5" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">task-relevant concepts</text>
<rect x="940" y="230" width="180" height="120" rx="16" fill="#F3EDFF" stroke="#7B61FF" stroke-width="2" filter="url(#shadow)"/>
<text x="1030.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Task head</text>
<text x="1030.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">class · box · mask</text>
</svg>
