<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
<title id="title">Computer vision evolved from features to adaptable representations</title>
<desc id="description">A five-stage timeline from hand-crafted features through CNNs, pretrained encoders, vision transformers, and adaptable foundation models.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1200" height="560" fill="#F7FAFC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Computer vision evolved from features to adaptable representations</text>
<rect x="50" y="100" width="1100" height="370" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
<text x="72" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Increasing transferability and task breadth</text>
<polyline points="255,268 290,268" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="470,268 505,268" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="685,268 720,268" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="900,268 935,268" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="75" y="205" width="180" height="125" rx="16" fill="#FFF7E6" stroke="#D9822B" stroke-width="2" filter="url(#shadow)"/>
<text x="165.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Hand-crafted</text>
<text x="165.0" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">features</text>
<text x="165.0" y="289" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">SIFT · HOG · rules</text>
<rect x="290" y="205" width="180" height="125" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="380.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Task-specific</text>
<text x="380.0" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CNNs</text>
<text x="380.0" y="289" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">features learned from labels</text>
<rect x="505" y="205" width="180" height="125" rx="16" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="595.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pretrained</text>
<text x="595.0" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">encoders</text>
<text x="595.0" y="289" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">transfer and fine-tuning</text>
<rect x="720" y="205" width="180" height="125" rx="16" fill="#EAFBF3" stroke="#219653" stroke-width="2" filter="url(#shadow)"/>
<text x="810.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Vision</text>
<text x="810.0" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">transformers</text>
<text x="810.0" y="289" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">global token interactions</text>
<rect x="935" y="205" width="190" height="125" rx="16" fill="#F3EDFF" stroke="#7B61FF" stroke-width="2" filter="url(#shadow)"/>
<text x="1030.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Adaptable vision</text>
<text x="1030.0" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">foundation models</text>
<text x="1030.0" y="289" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">prompts · open vocabulary</text>
</svg>
