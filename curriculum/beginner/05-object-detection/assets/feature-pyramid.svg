<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Feature pyramids combine detail with semantics</title>
<desc id="description">Four backbone stages become progressively lower resolution and more semantic, while lateral connections and top-down fusion create pyramid outputs P2 through P5.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Feature pyramids combine detail with semantics</text>
<rect x="64" y="120" width="650" height="680" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Backbone features</text>
<rect x="886" y="120" width="650" height="680" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="908" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Fused pyramid</text>
<polyline points="350,265 1240,265" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="742" y="233" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="800" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">lateral</text>
<polyline points="350,400 1240,400" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="350,530 1240,530" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="350,665 1240,665" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1350,610 1350,580" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="1377" y="578" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1435" y="595" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">top-down</text>
<polyline points="1350,480 1350,450" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="1350,350 1350,320" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="130" y="210" width="220" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="240.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">C2</text>
<text x="240.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">high resolution</text>
<text x="240.0" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">lower semantics</text>
<rect x="130" y="350" width="220" height="100" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="240.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">C3</text>
<text x="240.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">1/8 scale</text>
<rect x="130" y="480" width="220" height="100" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="240.0" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">C4</text>
<text x="240.0" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">1/16 scale</text>
<rect x="130" y="610" width="220" height="110" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="240.0" y="644" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">C5</text>
<text x="240.0" y="672" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">low resolution</text>
<text x="240.0" y="690" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">high semantics</text>
<rect x="1240" y="210" width="220" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1350.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">P2</text>
<text x="1350.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">small objects</text>
<rect x="1240" y="350" width="220" height="100" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1350.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">P3</text>
<text x="1350.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">fine scale</text>
<rect x="1240" y="480" width="220" height="100" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1350.0" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">P4</text>
<text x="1350.0" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">medium scale</text>
<rect x="1240" y="610" width="220" height="110" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1350.0" y="644" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">P5</text>
<text x="1350.0" y="672" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">large objects</text>
</svg>
