<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
<title id="title">Detection failures live at instance and slice levels</title>
<desc id="description">An evaluated image branches to correct detections, prediction errors, coverage failures, and slice-level failures. Prediction errors include localization, wrong class, duplicate, and background false positive. Coverage failures include missed objects. Small-object and source-shift failures are measured as slices rather than exclusive per-instance labels.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="1000" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Detection failures live at instance and slice levels</text>
<rect x="64" y="130" width="1120" height="780" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Per-instance outcomes</text>
<rect x="1220" y="130" width="516" height="780" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1242" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Cross-instance slices</text>
<polyline points="340,426 390,426 390,265 450,265" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="340,465 450,455" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="340,504 390,504 390,675 450,675" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,422 750,422 750,205 820,205" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,444 760,444 760,355 820,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,466 760,466 760,505 820,505" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,488 750,488 750,655 820,655" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,675 740,675 740,805 820,805" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1070,805 1160,805 1160,330 1350,330" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="225,400 225,100 1180,100 1180,620 1350,620" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="110" y="400" width="230" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="225.0" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Evaluated image</text>
<text x="225.0" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">predictions + ground truth</text>
<rect x="450" y="210" width="230" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="565.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Correct</text>
<text x="565.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">class + IoU + unique match</text>
<rect x="450" y="400" width="230" height="110" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="565.0" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Prediction error</text>
<text x="565.0" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">a returned box is wrong</text>
<rect x="450" y="620" width="230" height="110" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="565.0" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Coverage failure</text>
<text x="565.0" y="682" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">a target was not claimed</text>
<rect x="820" y="150" width="250" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Localization error</text>
<text x="945.0" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">right region, IoU too low</text>
<rect x="820" y="300" width="250" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Wrong class</text>
<text x="945.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">overlap, incorrect label</text>
<rect x="820" y="450" width="250" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="484" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Duplicate</text>
<text x="945.0" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">object already matched</text>
<rect x="820" y="600" width="250" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="634" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Background FP</text>
<text x="945.0" y="662" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">no plausible target overlap</text>
<rect x="820" y="750" width="250" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="784" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Missed object</text>
<text x="945.0" y="812" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">unmatched ground truth</text>
<rect x="1350" y="270" width="250" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1475.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Small-object failure</text>
<text x="1475.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">miss/error rate by size</text>
<rect x="1350" y="560" width="250" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1475.0" y="594" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Source-shift failure</text>
<text x="1475.0" y="622" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">quality gap by factory</text>
</svg>
