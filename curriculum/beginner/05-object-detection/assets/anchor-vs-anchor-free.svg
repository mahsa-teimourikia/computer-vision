<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Two ways to assign responsibility</title>
<desc id="description">The anchor-based path starts from predefined shapes and regresses offsets, while the anchor-free path starts from a responsible point and predicts box distances.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Two ways to assign responsibility</text>
<rect x="64" y="130" width="700" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Anchor-based</text>
<rect x="836" y="130" width="700" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="858" y="164" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Anchor-free</text>
<polyline points="290,380 350,380" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="540,380 565,380" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1070,380 1130,380" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1320,380 1350,380" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="120" y="330" width="170" height="100" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="205.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Feature cell</text>
<rect x="350" y="310" width="190" height="140" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="445.0" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Anchor bank</text>
<text x="445.0" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">scales + aspect ratios</text>
<rect x="565" y="310" width="160" height="140" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="645.0" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Match + offsets</text>
<text x="645.0" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">positive / negative / ignore</text>
<rect x="900" y="330" width="170" height="100" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="985.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Feature cell</text>
<rect x="1130" y="310" width="190" height="140" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1225.0" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Responsible point</text>
<text x="1225.0" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">center / inside box</text>
<rect x="1350" y="310" width="150" height="140" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1425.0" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Predict box</text>
<text x="1425.0" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">l, t, r, b + class</text>
</svg>
