<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" role="img" aria-labelledby="title description">
<title id="title">Teacher–student learning without labels</title>
<desc id="description">Global and local crops enter a trainable student while global crops enter a stop-gradient teacher. Student and teacher distributions are matched, and an exponential moving average of student weights updates the teacher.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1480" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Teacher–student learning without labels</text>
<rect x="64" y="112" width="330" height="570" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Views from one image</text>
<rect x="458" y="112" width="620" height="570" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="480" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Asymmetric networks</text>
<rect x="1142" y="112" width="274" height="570" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1164" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Learning signals</text>
<polyline points="334,285 430,285 430,285 512,285" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="334,524 430,524 430,344 512,344" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="334,331 414,331 414,535 816,535" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="720,307 1120,307 1120,314 1190,314" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1024,535 1100,535 1100,364 1190,364" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="616,380 616,420 920,420 920,462" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="702" y="403" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="760" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">EMA: θt ← mθt + (1−m)θs</text>
<rect x="112" y="244" width="222" height="116" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="223.0" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Global crop</text>
<text x="223.0" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">teacher + student</text>
<rect x="112" y="466" width="222" height="116" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="223.0" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Local crops</text>
<text x="223.0" y="528" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">student only</text>
<rect x="512" y="234" width="208" height="146" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="616.0" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Student</text>
<text x="616.0" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">gradient update</text>
<text x="616.0" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">sharpened output</text>
<rect x="816" y="462" width="208" height="146" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="920.0" y="496" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Teacher</text>
<text x="920.0" y="524" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">stop-gradient</text>
<text x="920.0" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">centered target</text>
<rect x="1190" y="270" width="178" height="126" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1279.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Distribution match</text>
<text x="1279.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">self-distillation loss</text>
</svg>
