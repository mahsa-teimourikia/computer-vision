<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
<title id="title">Contrastive learning as view agreement</title>
<desc id="description">One unlabeled image creates two augmented views. A shared encoder and projection head map both views to embeddings that form a positive pair, while other images in the batch provide negatives.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1500" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Contrastive learning as view agreement</text>
<rect x="64" y="112" width="420" height="570" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Create two semantic-preserving views</text>
<rect x="548" y="112" width="540" height="570" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="570" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Shared representation path</text>
<rect x="1152" y="112" width="284" height="570" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1174" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Batch objective</text>
<polyline points="236,276 236,300 238,300 238,330" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="316,276 382,276 382,486 238,486 238,522" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="348,386 596,386" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="348,578 596,578" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="768,386 856,386" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="768,578 856,578" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1028,386 1120,386 1120,443 1204,443" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1028,578 1120,578 1120,505 1204,505" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="176" y="190" width="200" height="86" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="276.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Unlabeled image</text>
<rect x="128" y="330" width="220" height="112" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="238.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">View A</text>
<text x="238.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">crop · brightness · blur</text>
<rect x="128" y="522" width="220" height="112" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="238.0" y="556" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">View B</text>
<text x="238.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">independent transform</text>
<rect x="596" y="320" width="172" height="132" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="682.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Encoder fθ</text>
<text x="682.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">representation h₁</text>
<rect x="596" y="524" width="172" height="108" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="682.0" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Encoder fθ</text>
<text x="682.0" y="586" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">shared weights · h₂</text>
<rect x="856" y="320" width="172" height="132" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="942.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Projection g</text>
<text x="942.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">z₁</text>
<rect x="856" y="524" width="172" height="108" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="942.0" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Projection g</text>
<text x="942.0" y="586" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">z₂</text>
<rect x="1204" y="396" width="180" height="156" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1294.0" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">NT-Xent</text>
<text x="1294.0" y="458" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">positive: z₁ ↔ z₂</text>
<text x="1294.0" y="476" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">negatives: other views</text>
</svg>
