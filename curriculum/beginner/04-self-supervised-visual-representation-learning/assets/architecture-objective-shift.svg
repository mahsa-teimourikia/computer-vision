<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title description">
<title id="title">From processing architecture to learning objective</title>
<desc id="description">Two connected panels show that CNN, ViT, and Swin determine how information can flow, while contrastive, teacher-student, and masked objectives determine what representations are learned.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="660" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">From processing architecture to learning objective</text>
<rect x="64" y="112" width="580" height="470" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Courses 01–03 · processing architecture</text>
<rect x="756" y="112" width="580" height="470" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="778" y="146" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Course 04 · learning objective</text>
<polyline points="292,298 388,298" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1008,298 1080,298" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="596,298 700,298 700,196 1184,196 1184,226" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="642" y="179" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="700" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">separate decisions</text>
<rect x="112" y="246" width="180" height="104" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="202.0" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Images</text>
<text x="202.0" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pixels and patches</text>
<rect x="388" y="226" width="208" height="144" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="492.0" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CNN · ViT · Swin</text>
<text x="492.0" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">information-flow bias</text>
<rect x="250" y="430" width="220" height="92" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="360.0" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">How can information</text>
<text x="360.0" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">flow?</text>
<rect x="800" y="226" width="208" height="144" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="904.0" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Unlabeled images</text>
<text x="904.0" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">structure is already present</text>
<rect x="1080" y="226" width="208" height="144" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1184.0" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Contrast · Distill · Mask</text>
<text x="1184.0" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">self-created targets</text>
<rect x="920" y="430" width="240" height="92" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1040.0" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">What should the</text>
<text x="1040.0" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">representation learn?</text>
</svg>
