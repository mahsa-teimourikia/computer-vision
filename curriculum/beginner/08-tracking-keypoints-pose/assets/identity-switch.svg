<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" role="img" aria-labelledby="title description">
<title id="title">Identity switch at an object crossing</title>
<desc id="description">Two real objects cross while a tracker changes which predicted identity follows each physical trajectory.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="720" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Identity switch at an object crossing</text>
<rect x="64" y="100" width="1672" height="550" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Structured visual state</text>
<polyline points="350,360 430,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,360 760,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1010,360 1090,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1340,360 1420,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="275" width="250" height="170" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="225.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Before crossing</text>
<text x="225.0" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">red→7 · blue→9</text>
<rect x="430" y="275" width="250" height="170" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="555.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Overlap / occlusion</text>
<text x="555.0" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">geometry ambiguous</text>
<rect x="760" y="275" width="250" height="170" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="885.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Wrong assignment</text>
<text x="885.0" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">cost favors swap</text>
<rect x="1090" y="275" width="250" height="170" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1215.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">After crossing</text>
<text x="1215.0" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">red→9 · blue→7</text>
<rect x="1420" y="275" width="250" height="170" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1545.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">History corrupted</text>
<text x="1545.0" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pose and analytics inherit error</text>
</svg>
