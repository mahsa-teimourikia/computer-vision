<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Four segmentation questions</title>
<desc id="description">A left-to-right sequence contrasts semantic pixel classes, instance identities, panoptic things and stuff, and a prompt-selected region.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Four segmentation questions</text>
<rect x="64" y="120" width="1472" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Segmentation output contracts</text>
<polyline points="370,395 470,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="362" y="368" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="420" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">identity</text>
<polyline points="720,395 820,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="712" y="368" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="770" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">full scene</text>
<polyline points="1070,395 1170,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1062" y="368" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1120" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">target cue</text>
<rect x="120" y="320" width="250" height="150" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="245.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Semantic</text>
<text x="245.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">class per pixel</text>
<rect x="470" y="320" width="250" height="150" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="595.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Instance</text>
<text x="595.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">class + object ID</text>
<rect x="820" y="320" width="250" height="150" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Panoptic</text>
<text x="945.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">things + stuff</text>
<rect x="1170" y="320" width="250" height="150" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1295.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Promptable</text>
<text x="1295.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">requested region</text>
</svg>
