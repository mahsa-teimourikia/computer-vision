<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Detection errors become segmentation prompt errors</title>
<desc id="description">An image enters a detector, whose box becomes a prompt. A promptable segmenter creates a precise mask, which is then accepted, reviewed, or rejected under policy. Box error propagates into mask error.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Detection errors become segmentation prompt errors</text>
<rect x="64" y="120" width="1472" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Segmentation output contracts</text>
<polyline points="270,400 350,400" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="580,400 660,400" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="562" y="373" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="620" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">localization</text>
<polyline points="890,400 970,400" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="872" y="373" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="930" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">prompt</text>
<polyline points="1250,400 1330,400" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1232" y="373" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1290" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">precise mask</text>
<rect x="80" y="330" width="190" height="140" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="175.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image</text>
<text x="175.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">inspection frame</text>
<rect x="350" y="330" width="230" height="140" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="465.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Detector</text>
<text x="465.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">class + box + score</text>
<rect x="660" y="330" width="230" height="140" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="775.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Box prompt</text>
<text x="775.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">perfect or perturbed</text>
<rect x="970" y="330" width="280" height="140" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1110.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Promptable segmenter</text>
<text x="1110.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">image embedding + box</text>
<rect x="1330" y="330" width="190" height="140" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1425.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Mask + policy</text>
<text x="1425.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">accept · review · reject</text>
</svg>
