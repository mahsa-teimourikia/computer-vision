<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Mask R-CNN adds an aligned mask branch</title>
<desc id="description">An image flows through a backbone and feature pyramid into proposals and ROI Align, which branches to class, box, and per-instance mask outputs.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Mask R-CNN adds an aligned mask branch</text>
<rect x="64" y="120" width="1472" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Segmentation output contracts</text>
<polyline points="275,395 355,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="605,395 685,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="905,395 985,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1205,356 1250,356 1250,348 1300,348" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1190" y="321" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1248" y="338" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">class</text>
<polyline points="1205,395 1300,395" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1194" y="368" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1252" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">box</text>
<polyline points="1205,434 1250,434 1250,442 1300,442" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1190" y="438" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1248" y="455" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">mask</text>
<rect x="95" y="330" width="180" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="185.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image</text>
<text x="185.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">H × W × 3</text>
<rect x="355" y="330" width="250" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="480.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Backbone + FPN</text>
<text x="480.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">multi-scale features</text>
<rect x="685" y="330" width="220" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="795.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Proposals</text>
<text x="795.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">candidate boxes</text>
<rect x="985" y="330" width="220" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1095.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">ROI Align</text>
<text x="1095.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">subpixel sampling</text>
<rect x="1300" y="300" width="210" height="190" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1405.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Parallel heads</text>
<text x="1405.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">class · box · mask</text>
</svg>
