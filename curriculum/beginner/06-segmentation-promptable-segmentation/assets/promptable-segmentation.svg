<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Promptable segmentation reuses one image embedding</title>
<desc id="description">The image is encoded once into a reusable embedding. A point, box, or mask prompt is encoded separately. Both meet in a mask decoder that returns candidate masks and quality estimates.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Promptable segmentation reuses one image embedding</text>
<rect x="64" y="120" width="1472" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Segmentation output contracts</text>
<polyline points="280,295 370,295" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="600,295 690,295" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="600,585 690,585" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="940,295 1000,295 1000,391 1060,391" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="937" y="268" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="995" y="285" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">cached</text>
<polyline points="940,585 1000,585 1000,459 1060,459" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1310,425 1370,425" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="230" width="190" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="185.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image</text>
<text x="185.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">encode once</text>
<rect x="370" y="230" width="230" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="485.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image encoder</text>
<text x="485.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">expensive path</text>
<rect x="690" y="230" width="250" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="815.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image embedding</text>
<text x="815.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">reused across prompts</text>
<rect x="370" y="520" width="230" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="485.0" y="554" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Prompt</text>
<text x="485.0" y="582" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">point · box · mask</text>
<rect x="690" y="520" width="250" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="815.0" y="554" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Prompt encoder</text>
<text x="815.0" y="582" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">target representation</text>
<rect x="1060" y="340" width="250" height="170" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1185.0" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Mask decoder</text>
<text x="1185.0" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">combine image + prompt</text>
<rect x="1370" y="350" width="150" height="150" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1445.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Candidate</text>
<text x="1445.0" y="406" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">masks</text>
<text x="1445.0" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">quality estimates</text>
</svg>
