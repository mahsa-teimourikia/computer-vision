<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title description">
<title id="title">Efficient convolution changes channel connectivity, not just arithmetic</title>
<desc id="description">Four vertical operator flows compare dense convolution connecting every input to every output, grouped convolution splitting channels, depthwise convolution using one spatial filter per channel, and pointwise one-by-one convolution mixing channels.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="820" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Efficient convolution changes channel connectivity, not just arithmetic</text>
<rect x="50" y="110" width="330" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">DENSE CONVOLUTION</text>
<rect x="440" y="110" width="330" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="462" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">GROUPED CONVOLUTION</text>
<rect x="830" y="110" width="330" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="852" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">DEPTHWISE CONVOLUTION</text>
<rect x="1220" y="110" width="330" height="650" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1242" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">POINTWISE MIXING</text>
<polyline points="215,275 215,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="215,460 215,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="605,275 605,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="605,460 605,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="995,275 995,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="995,460 995,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1385,275 1385,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1385,460 1385,550" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="190" width="230" height="85" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="215.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cᵢₙ channels</text>
<rect x="100" y="350" width="230" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="215.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">K × K dense filters</text>
<text x="215.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">every input → every output</text>
<rect x="100" y="550" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="215.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cₒᵤₜ channels</text>
<text x="215.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">K² Cᵢₙ Cₒᵤₜ params</text>
<rect x="490" y="190" width="230" height="85" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="605.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cᵢₙ channels</text>
<rect x="490" y="350" width="230" height="110" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="605.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">G independent groups</text>
<text x="605.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">limited cross-group mixing</text>
<rect x="490" y="550" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="605.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cₒᵤₜ channels</text>
<text x="605.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">K² Cᵢₙ Cₒᵤₜ / G params</text>
<rect x="880" y="190" width="230" height="85" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="995.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cᵢₙ channels</text>
<rect x="880" y="350" width="230" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="995.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">One K × K per channel</text>
<text x="995.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">spatial filtering only</text>
<rect x="880" y="550" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="995.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cᵢₙ channels</text>
<text x="995.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">K² Cᵢₙ params</text>
<rect x="1270" y="190" width="230" height="85" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="1385.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cᵢₙ channels</text>
<rect x="1270" y="350" width="230" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1385.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">1 × 1 channel mixing</text>
<text x="1385.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">no spatial neighborhood</text>
<rect x="1270" y="550" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="1385.0" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cₒᵤₜ channels</text>
<text x="1385.0" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">Cᵢₙ Cₒᵤₜ params</text>
</svg>
