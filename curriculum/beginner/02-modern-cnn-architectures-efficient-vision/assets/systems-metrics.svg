<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title description">
<title id="title">No single efficiency metric describes deployment behavior</title>
<desc id="description">Three groups distinguish static artifact metrics such as parameter count and model size, analytic workload estimates such as MACs and activation traffic, and measured runtime metrics such as latency distribution, throughput, and peak memory.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1500" height="820" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">No single efficiency metric describes deployment behavior</text>
<rect x="50" y="120" width="420" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">STATIC ARTIFACT · MODEL DEFINITION</text>
<rect x="540" y="120" width="420" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="562" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">ANALYTIC ESTIMATE · FIXED SHAPE</text>
<rect x="1030" y="120" width="420" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1052" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">MEASURED RUNTIME · TARGET SYSTEM</text>
<rect x="100" y="220" width="320" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="260.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Parameter count</text>
<text x="260.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">learned scalar count</text>
<text x="260.0" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">not activation memory</text>
<rect x="100" y="450" width="320" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="260.0" y="484" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Model file size</text>
<text x="260.0" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">serialization + precision</text>
<text x="260.0" y="530" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">not elapsed time</text>
<rect x="590" y="220" width="320" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="750.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Approximate MACs</text>
<text x="750.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">arithmetic workload</text>
<text x="750.0" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">not kernel efficiency</text>
<rect x="590" y="450" width="320" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="750.0" y="484" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Activation traffic</text>
<text x="750.0" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">intermediate tensors</text>
<text x="750.0" y="530" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">shape-dependent estimate</text>
<rect x="1080" y="185" width="320" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1240.0" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Latency distribution</text>
<text x="1240.0" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">median · IQR · p90 · p95</text>
<text x="1240.0" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">batch 1 and target runtime</text>
<rect x="1080" y="365" width="320" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1240.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Throughput</text>
<text x="1240.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">items per second</text>
<text x="1240.0" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">under a stated batch/load</text>
<rect x="1080" y="545" width="320" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1240.0" y="579" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Peak device memory</text>
<text x="1240.0" y="607" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">allocator high-water mark</text>
<text x="1240.0" y="625" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">backend-specific</text>
</svg>
