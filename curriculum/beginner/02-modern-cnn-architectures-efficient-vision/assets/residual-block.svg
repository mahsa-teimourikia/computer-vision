<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Residual shortcuts: identity when shapes match, projection when they do not</title>
<desc id="description">Two residual block flows. An identity shortcut sends an unchanged tensor around a residual branch when shapes match. A projection shortcut applies a one-by-one convolution and stride before addition when channels or resolution change.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="50" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Residual shortcuts: identity when shapes match, projection when they do not</text>
<rect x="50" y="110" width="620" height="580" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="72" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">IDENTITY SHORTCUT · SAME H × W × C</text>
<rect x="730" y="110" width="620" height="580" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="752" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">PROJECTION SHORTCUT · SHAPE CHANGES</text>
<polyline points="220,285 250,285 250,270 280,270" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="460,270 480,270 480,280 500,280" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="155,350 155,450 570,450 570,370" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="307" y="428" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="365" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">identity</text>
<polyline points="900,285 925,285 925,250 950,250" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1130,250 1155,250 1155,280 1180,280" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="835,350 835,525 950,525" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="857" y="508" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="915" y="525" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">reshape</text>
<polyline points="1130,525 1250,525 1250,370" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="90" y="250" width="130" height="100" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="155.0" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Input x</text>
<text x="155.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">H × W × C</text>
<rect x="280" y="210" width="180" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="370.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Residual branch</text>
<text x="370.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">F(x) · shape preserved</text>
<rect x="500" y="250" width="140" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="570.0" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Add + activate</text>
<text x="570.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">y = F(x) + x</text>
<rect x="770" y="250" width="130" height="100" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2" filter="url(#shadow)"/>
<text x="835.0" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Input x</text>
<text x="835.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">H × W × Cᵢₙ</text>
<rect x="950" y="190" width="180" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1040.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Residual branch</text>
<text x="1040.0" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">F(x) · stride or width</text>
<rect x="950" y="470" width="180" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1040.0" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">1 × 1 projection</text>
<text x="1040.0" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">Wₛ * x · match shape</text>
<rect x="1180" y="250" width="140" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1250.0" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Add + activate</text>
<text x="1250.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">y = F(x) + Wₛ*x</text>
</svg>
