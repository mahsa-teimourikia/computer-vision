<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2308 650" role="img" aria-labelledby="title description">
<title id="title">Enterprise document intelligence boundary</title>
<desc id="description">An enterprise flow from document intake and malware validation through type routing, parsing, structured document creation, provenance verification, human review, and a separately bounded downstream system.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2308" height="650" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Enterprise document intelligence boundary</text>
<rect x="64" y="100" width="2180" height="480" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Enterprise document intelligence boundary</text>
