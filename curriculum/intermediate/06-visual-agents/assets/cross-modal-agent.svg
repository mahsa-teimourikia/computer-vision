<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 860" role="img" aria-labelledby="title description">
<title id="title">Cross-modal evidence before decision</title>
<desc id="description">Inspection image, maintenance manual, and recent video each feed an authorized tool and verifier before a deterministic manual-review decision.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2048" height="860" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Cross-modal evidence before decision</text>
<rect x="64" y="100" width="1920" height="670" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">All required modalities remain independently source-bound</text>
<polyline points="410,235 540,235" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="410,430 540,430" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="410,625 540,625" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="840,235 930,235 930,391 1010,391" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="840,430 1010,430" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="840,625 930,625 930,469 1010,469" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1360,430 1530,430" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="180" width="300" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="260.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Inspection image</text>
<text x="260.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">region evidence</text>
<rect x="110" y="375" width="300" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="260.0" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Maintenance manual</text>
<text x="260.0" y="437" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">page/block evidence</text>
<rect x="110" y="570" width="300" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="260.0" y="604" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Recent video</text>
<text x="260.0" y="632" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">interval + track evidence</text>
<rect x="540" y="180" width="300" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="690.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Vision tool</text>
<text x="690.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">damage observation</text>
<rect x="540" y="375" width="300" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="690.0" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Document search</text>
<text x="690.0" y="437" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">cited policy rule</text>
<rect x="540" y="570" width="300" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="690.0" y="604" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Video event search</text>
<text x="690.0" y="632" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">recent recurrence</text>
<rect x="1010" y="365" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="1185.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Evidence verifier</text>
<text x="1185.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">complete + fresh + supported</text>
<rect x="1530" y="365" width="380" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1720.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Deterministic rule</text>
<text x="1720.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">recommend or review</text>
</svg>
