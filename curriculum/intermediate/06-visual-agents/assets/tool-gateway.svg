<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 760" role="img" aria-labelledby="title description">
<title id="title">Tool availability is not authorization</title>
<desc id="description">A planner proposal passes through principal, resource, capability, and side-effect policy before an approved tool registry can execute it.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2048" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Tool availability is not authorization</text>
<rect x="64" y="100" width="1920" height="560" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Policy boundary — immutable to the planner</text>
<polyline points="400,360 480,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="780,360 860,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1180,330 1230,330 1230,260 1300,260" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1180,390 1230,390 1230,500 1300,500" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1630,260 1670,260 1670,350 1710,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1630,500 1670,500 1670,410 1710,410" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="120" y="300" width="280" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="260.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Planner</text>
<text x="260.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">proposes tool + args</text>
<rect x="480" y="300" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="630.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Policy gate</text>
<text x="630.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">principal · tenant · resource</text>
<rect x="860" y="300" width="320" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1020.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Approved registry</text>
<text x="1020.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">contract + version + side effect</text>
<rect x="1300" y="200" width="330" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1465.0" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Read-only tools</text>
<text x="1465.0" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">vision · docs · video</text>
<rect x="1300" y="440" width="330" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1465.0" y="474" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Local transforms</text>
<text x="1465.0" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">crop · resize · calculate</text>
<rect x="1710" y="320" width="230" height="120" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="1825.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Validated result</text>
<text x="1825.0" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">source-bound envelope</text>
</svg>
