<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 760" role="img" aria-labelledby="title description">
<title id="title">Typed state is an operational contract</title>
<desc id="description">Typed visual-agent state contains a goal, verified facts, open questions, multimodal evidence, tool results, budgets, and an explicit status.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2048" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Typed state is an operational contract</text>
<rect x="180" y="110" width="1688" height="560" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="202" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">AgentState v1 — JSON-serializable, schema-versioned, session-local</text>
<polyline points="680,265 809,265" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="1239,265 1368,265" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="680,500 809,500" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<polyline points="1239,500 1368,500" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="250" y="205" width="430" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="465.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Goal + identity</text>
<text x="465.0" y="267" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">task · principal · tenant</text>
<rect x="809" y="205" width="430" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1024.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Verified facts</text>
<text x="1024.0" y="267" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">claim → evidence IDs</text>
<rect x="1368" y="205" width="430" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1583.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Open questions</text>
<text x="1583.0" y="267" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">dependency nodes</text>
<rect x="250" y="440" width="430" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="465.0" y="474" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Multimodal evidence</text>
<text x="465.0" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">region · block · interval</text>
<rect x="809" y="440" width="430" height="120" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="1024.0" y="474" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Tool results + trace</text>
<text x="1024.0" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">accepted and rejected</text>
<rect x="1368" y="440" width="430" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1583.0" y="474" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Budget + status</text>
<text x="1583.0" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">steps · calls · cost · stop</text>
</svg>
