<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" role="img" aria-labelledby="title description">
<title id="title">Use exact tools after semantic extraction</title>
<desc id="description">A versioned perception adapter produces structured observations for geometry, count, and arithmetic tools; all tools write versioned input and output events.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="820" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Use exact tools after semantic extraction</text>
<rect x="64" y="110" width="520" height="610" rx="20" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="86" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Semantic boundary</text>
<rect x="650" y="110" width="1086" height="610" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="672" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Deterministic boundary</text>
<polyline points="500,360 610,360 610,245 720,245" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="500,390 720,415" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="500,420 610,420 610,585 720,585" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,245 1140,245 1140,360 1260,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,415 1260,390" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,585 1140,585 1140,420 1260,420" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="150" y="330" width="350" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="325.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Versioned perception</text>
<text x="325.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">objects · attributes · regions</text>
<rect x="720" y="190" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="870.0" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Geometry tool</text>
<text x="870.0" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">boxes → relations</text>
<rect x="720" y="360" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="870.0" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Counting tool</text>
<text x="870.0" y="422" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">instance IDs → cardinality</text>
<rect x="720" y="530" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="870.0" y="564" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Arithmetic tool</text>
<text x="870.0" y="592" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">values → predicate</text>
<rect x="1260" y="330" width="390" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1455.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Tool event log</text>
<text x="1455.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">version · inputs · outputs · error</text>
</svg>
