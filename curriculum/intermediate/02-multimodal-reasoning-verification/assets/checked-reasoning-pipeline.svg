<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 760" role="img" aria-labelledby="title description">
<title id="title">From visual question to checked conclusion</title>
<desc id="description">A six-stage flow moves from bounded question to task plan, bound evidence, deterministic tool results, checked claims, and an answer or review-required conclusion.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2040" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">From visual question to checked conclusion</text>
<rect x="64" y="100" width="1912" height="596" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Observable reasoning contract</text>
<polyline points="360,352 410,352" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="670,352 720,352" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="980,352 1030,352" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1290,352 1340,352" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1600,352 1650,352" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="300" width="260" height="104" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="230.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Bounded question</text>
<text x="230.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">scope · rule · output</text>
<rect x="410" y="300" width="260" height="104" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="540.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Task plan</text>
<text x="540.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">required facts · DAG</text>
<rect x="720" y="300" width="260" height="104" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="850.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Bound evidence</text>
<text x="850.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">image · object · region</text>
<rect x="1030" y="300" width="260" height="104" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="1160.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Tool results</text>
<text x="1160.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">versioned · replayable</text>
<rect x="1340" y="300" width="260" height="104" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1470.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Checked claims</text>
<text x="1470.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">sufficiency · consistency</text>
<rect x="1650" y="300" width="260" height="104" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1780.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Conclusion</text>
<text x="1780.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">answer · review required</text>
</svg>
