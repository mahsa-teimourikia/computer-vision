<text x="1165.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Bounded planner</text>
<text x="1165.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">DAG · budgets · allow-list</text>
