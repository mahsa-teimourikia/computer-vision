<text x="285.0" y="644" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Decision policy</text>
<text x="285.0" y="672" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">answer · review · reject</text>
<rect x="1660" y="210" width="340" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1830.0" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Version registry</text>
<text x="1830.0" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">model · prompt · tool · rule</text>
<rect x="1660" y="430" width="340" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1830.0" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Human review queue</text>
<text x="1830.0" y="492" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">bounded context · adjudication</text>
<rect x="1660" y="650" width="340" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1830.0" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Separate action service</text>
<text x="1830.0" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">identity · approval · audit</text>
