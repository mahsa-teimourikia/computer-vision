<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title description">
<title id="title">Evidence is capability-specific</title>
<desc id="description">Four rows show an attribute claim requiring one region, a relation requiring two bound regions, a count requiring the complete unique set, and a change requiring before and after facts plus the decision rule.</desc>
