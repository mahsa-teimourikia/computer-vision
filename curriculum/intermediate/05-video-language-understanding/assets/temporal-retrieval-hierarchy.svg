<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 650" role="img" aria-labelledby="title description">
<title id="title">Long-video retrieval descends from coarse context to precise intervals</title>
<desc id="description">A hierarchy from a long video to scenes, clips, observable change points, event intervals, track context, and the minimum sufficient temporal evidence bundle.</desc>
