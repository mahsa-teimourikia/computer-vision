<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title description">
<title id="title">Visual Evidence Ablation</title>
<desc id="description">Four image conditions—correct, blank, wrong, and one-fact counterfactual—receive the same question. Their answer, confidence, and evidence changes feed an evidence-use diagnosis.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Visual Evidence Ablation</text>
<rect x="64" y="100" width="1672" height="700" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Same question · controlled visual intervention</text>
<polyline points="255,310 255,380 718,380 718,440" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="665,310 665,390 842,390 842,440" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1075,310 1075,390 958,390 958,440" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1485,310 1485,380 1082,380 1082,440" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="900,560 900,650" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="120" y="200" width="270" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="255.0" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Correct image</text>
<text x="255.0" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">expected evidence</text>
<rect x="530" y="200" width="270" height="110" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="665.0" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Blank image</text>
<text x="665.0" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">visual signal removed</text>
<rect x="940" y="200" width="270" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1075.0" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Wrong image</text>
<text x="1075.0" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">evidence mismatched</text>
<rect x="1350" y="200" width="270" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1485.0" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Counterfactual</text>
<text x="1485.0" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">one visual fact changed</text>
<rect x="660" y="440" width="480" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="900.0" y="474" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Same VLM + same question</text>
<text x="900.0" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">frozen prompt and decoding</text>
<rect x="660" y="650" width="480" height="110" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="900.0" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Evidence-use diagnosis</text>
<text x="900.0" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">answer · score · region · expected flip</text>
</svg>
