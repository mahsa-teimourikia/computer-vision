<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title description">
<title id="title">Visual token interfaces decide what the LLM can inspect</title>
<desc id="description">An image becomes patch features, then branches into pooled image, all-patch, selected multi-layer, or compressed query tokens before an LLM.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="900" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Visual token interfaces decide what the LLM can inspect</text>
<rect x="64" y="100" width="1672" height="700" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Information bottleneck</text>
<polyline points="300,420 390,420" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,382 690,382 690,220 760,220" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,407 700,407 700,355 760,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,433 700,433 700,490 760,490" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,458 690,458 690,625 760,625" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,220 1170,220 1170,387 1320,387" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,355 1200,355 1200,412 1320,412" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,490 1200,490 1200,438 1320,438" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1020,625 1170,625 1170,463 1320,463" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="365" width="190" height="110" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="205.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Image</text>
<text x="205.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">H × W</text>
<rect x="390" y="365" width="230" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="505.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Patch features</text>
<text x="505.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">N × d_v</text>
<rect x="760" y="170" width="260" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="890.0" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pooled</text>
<text x="890.0" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">1 token · global</text>
<rect x="760" y="305" width="260" height="100" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="890.0" y="339" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">All patches</text>
<text x="890.0" y="367" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">N tokens · detail</text>
<rect x="760" y="440" width="260" height="100" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="890.0" y="474" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Selected layers</text>
<text x="890.0" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">K tokens · selector bias</text>
<rect x="760" y="575" width="260" height="100" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="890.0" y="609" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Compressed queries</text>
<text x="890.0" y="637" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">M tokens · bottleneck</text>
<rect x="1320" y="365" width="300" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1470.0" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">LLM context</text>
<text x="1470.0" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">accessible visual evidence</text>
</svg>
