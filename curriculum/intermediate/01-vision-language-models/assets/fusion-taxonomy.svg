<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title description">
<title id="title">Multimodal fusion is an architectural choice</title>
<desc id="description">A left-to-right continuum from late separate embeddings through token projection, query resampling, cross-attention, and deeper multimodal fusion, with interaction and architectural cost increasing.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Multimodal fusion is an architectural choice</text>
<rect x="64" y="100" width="1672" height="560" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Increasing multimodal interaction and implementation coupling →</text>
<polyline points="370,360 440,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="690,360 760,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1010,360 1080,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1330,360 1400,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="120" y="300" width="250" height="120" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="245.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Late</text>
<text x="245.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">embedding score</text>
<rect x="440" y="300" width="250" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="565.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Projection</text>
<text x="565.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">visual prefix</text>
<rect x="760" y="300" width="250" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="885.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Resampling</text>
<text x="885.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">fixed queries</text>
<rect x="1080" y="300" width="250" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1205.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Cross-attention</text>
<text x="1205.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">visual memory</text>
<rect x="1400" y="300" width="250" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1525.0" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Deeper fusion</text>
<text x="1525.0" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">multi-level / joint</text>
</svg>
