<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" role="img" aria-labelledby="title description">
<title id="title">Resolution changes evidence and systems cost together</title>
<desc id="description">Higher image resolution preserves small details, then may create more tiles and visual tokens, increasing prefill memory and latency while introducing crop, duplicate, ordering, and boundary risks.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1800" height="820" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Resolution changes evidence and systems cost together</text>
<rect x="64" y="100" width="1672" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="134" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Processor policy is part of the model contract</text>
<polyline points="380,325 470,325" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="740,325 830,325" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1100,325 1190,325" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1460,325 1530,325" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="605,385 605,500" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="110" y="265" width="270" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="245.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Higher resolution</text>
<text x="245.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">small evidence retained</text>
<rect x="470" y="265" width="270" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="605.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Resize / tile</text>
<text x="605.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">crop · overlap · order</text>
<rect x="830" y="265" width="270" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="965.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Visual tokens</text>
<text x="965.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">N or tiles × N</text>
<rect x="1190" y="265" width="270" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1325.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">LLM prefill</text>
<text x="1325.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">memory · latency</text>
<rect x="1530" y="265" width="180" height="120" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1620.0" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Generated answer</text>
<text x="1620.0" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">detail may still be ignored</text>
<rect x="440" y="500" width="330" height="110" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="605.0" y="534" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Tiling failures</text>
<text x="605.0" y="562" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">cut · duplicate · lose global context</text>
</svg>
