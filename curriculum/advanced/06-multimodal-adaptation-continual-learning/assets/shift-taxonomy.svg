<rect x="745" y="180" width="190" height="108" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="840.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">TASK</text>
<text x="840.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">output contract</text>
