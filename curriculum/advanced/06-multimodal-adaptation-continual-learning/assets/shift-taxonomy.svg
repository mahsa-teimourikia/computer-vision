<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" role="img" aria-labelledby="title description">
<title id="title">Shift is not one thing</title>
<desc id="description">Seven shift types are shown: sensor, environment, object, task, language, policy, and embodiment; policy and embodiment require contracts beyond representation tuning.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="580" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Shift is not one thing</text>
<rect x="64" y="90" width="1272" height="420" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="124" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Characterize what changed before selecting trainable parameters</text>
