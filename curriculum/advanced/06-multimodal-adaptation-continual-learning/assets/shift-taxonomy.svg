<text x="410.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">ENVIRONMENT</text>
<text x="410.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">light · site</text>
<rect x="530" y="180" width="190" height="108" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="625.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">OBJECT</text>
