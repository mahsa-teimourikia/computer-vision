<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Pinhole projection is a sequence</title>
<desc id="description">A 3D world point passes through world-to-camera transformation, positive-depth validation, perspective division, and intrinsic pixel mapping.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Pinhole projection is a sequence</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Show manual perspective projection stages.</text>
<polyline points="270,340 340,340" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="247" y="314" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="305" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">frame</text>
<polyline points="580,340 660,340" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="562" y="314" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="620" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">validate</text>
<polyline points="900,340 980,340" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="882" y="314" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="940" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">raster</text>
<rect x="80" y="285" width="190" height="110" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="175.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">3D POINT</text>
<text x="175.0" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pw</text>
<text x="175.0" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">world, metres</text>
<rect x="340" y="275" width="240" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="460.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">EXTRINSICS</text>
<text x="460.0" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">Pc = R Pw + t</text>
<text x="460.0" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">world → camera</text>
<rect x="660" y="275" width="240" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="780.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PERSPECTIVE</text>
<text x="780.0" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">x=X/Z, y=Y/Z</text>
<text x="780.0" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">require Z &gt; 0</text>
<rect x="980" y="275" width="240" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1100.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">INTRINSICS</text>
<text x="1100.0" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">p ~ K[x,y,1]</text>
<text x="1100.0" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pixel output</text>
</svg>
