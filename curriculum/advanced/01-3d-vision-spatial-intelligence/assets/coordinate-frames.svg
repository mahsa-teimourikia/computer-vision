<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Every quantity declares its frame</title>
<desc id="description">World points are transformed into camera coordinates, divided onto a normalized image plane, and mapped by intrinsics into pixels.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Every quantity declares its frame</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Show the explicit coordinate transform chain.</text>
<polyline points="310,345 390,345" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="292" y="319" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="350" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">R, t</text>
<polyline points="630,345 710,345" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="612" y="319" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="670" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">divide by Z</text>
<polyline points="970,345 1050,345" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="952" y="319" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1010" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">K</text>
<rect x="70" y="285" width="240" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="190.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">WORLD</text>
<text x="190.0" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">(Xw, Yw, Zw)</text>
<text x="190.0" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">metres</text>
<rect x="390" y="285" width="240" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="510.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CAMERA</text>
<text x="510.0" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">(Xc, Yc, Zc)</text>
<text x="510.0" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">T_cw · +z forward</text>
<rect x="710" y="285" width="260" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="840.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">NORMALIZED IMAGE</text>
<text x="840.0" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">(x=X/Z, y=Y/Z)</text>
<text x="840.0" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">dimensionless</text>
<rect x="1050" y="285" width="240" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1170.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PIXEL</text>
<text x="1170.0" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">(u, v)</text>
<text x="1170.0" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">top-left origin</text>
</svg>
