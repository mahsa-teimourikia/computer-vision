<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Triangulation quality depends on ray angle</title>
<desc id="description">A wide ray intersection constrains a near point strongly, while nearly parallel rays create a long depth uncertainty region for a far point.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Triangulation quality depends on ray angle</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Compare well-conditioned and weak triangulation.</text>
<polyline points="270,280 470,358" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="312" y="293" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="370" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">ray</text>
<polyline points="270,490 470,408" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="312" y="423" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="370" y="440" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">ray</text>
<polyline points="970,280 1100,358" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="977" y="293" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1035" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">ray</text>
<polyline points="970,490 1100,408" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="977" y="423" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1035" y="440" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">ray</text>
<rect x="90" y="235" width="180" height="90" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="180.0" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CAMERA A</text>
<rect x="90" y="445" width="180" height="90" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="180.0" y="479" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CAMERA B</text>
<rect x="470" y="320" width="250" height="125" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="595.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">WIDE ANGLE</text>
<text x="595.0" y="376" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">small uncertainty</text>
<rect x="790" y="235" width="180" height="90" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="880.0" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CAMERA A</text>
<rect x="790" y="445" width="180" height="90" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="880.0" y="479" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CAMERA B</text>
<rect x="1100" y="320" width="230" height="125" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1215.0" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">NEARLY PARALLEL</text>
<text x="1215.0" y="376" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">large depth uncertainty</text>
</svg>
