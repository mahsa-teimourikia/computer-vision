<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Epipolar geometry verifies correspondence</title>
<desc id="description">Camera A observes a pixel whose ray and the camera baseline define an epipolar plane; the corresponding Camera B pixel must lie on its epipolar line.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Epipolar geometry verifies correspondence</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Explain the epipolar plane and image-line constraint.</text>
<polyline points="290,348 390,348" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="282" y="322" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="340" y="339" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">baseline + ray</text>
<polyline points="640,348 750,348" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="637" y="322" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="695" y="339" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">intersection</text>
<polyline points="1000,348 1100,348" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="992" y="322" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1050" y="339" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">verify</text>
<rect x="80" y="290" width="210" height="115" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="185.0" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CAMERA A</text>
<text x="185.0" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">point pA</text>
<text x="185.0" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">source ray</text>
<rect x="390" y="275" width="250" height="145" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="515.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">EPIPOLAR PLANE</text>
<text x="515.0" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CA, CB, P</text>
<text x="515.0" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">3D constraint</text>
<rect x="750" y="275" width="250" height="145" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="875.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">IMAGE B LINE</text>
<text x="875.0" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">lB = F pA</text>
<text x="875.0" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">candidate locus</text>
<rect x="1100" y="275" width="230" height="145" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1215.0" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CANDIDATE pB</text>
<text x="1215.0" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">pBᵀ F pA ≈ 0</text>
<text x="1215.0" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">geometric residual</text>
</svg>
