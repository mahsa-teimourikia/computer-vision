<text x="492" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">geometry</text>
<polyline points="710,350 765,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="680" y="324" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="738" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">inliers</text>
