<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Metric decisions remain evidence-bound</title>
<desc id="description">Versioned sensors and calibration produce frame-aware geometry, deterministic measurements, propagated uncertainty, a policy decision, and an auditable evidence record.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Metric decisions remain evidence-bound</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Show the spatial evidence and review pipeline.</text>
<polyline points="275,355 320,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="240" y="329" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="298" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">project/fuse</text>
<polyline points="530,355 590,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="502" y="329" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="560" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">query</text>
<polyline points="780,355 840,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="752" y="329" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="810" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">propagate</text>
<polyline points="1040,355 1100,355" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1012" y="329" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1070" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">policy</text>
<polyline points="1195,415 1195,500" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="1137" y="432" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1195" y="449" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">record</text>
<rect x="70" y="295" width="205" height="120" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="172.5" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SENSORS + CAL</text>
<text x="172.5" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">versioned</text>
<rect x="320" y="295" width="210" height="120" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="425.0" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">FRAME-AWARE</text>
<text x="425.0" y="351" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">GEOMETRY</text>
<text x="425.0" y="379" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">scale + visibility</text>
<rect x="590" y="295" width="190" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="685.0" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">MEASURE</text>
<text x="685.0" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">deterministic</text>
<rect x="840" y="295" width="200" height="120" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="940.0" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">UNCERTAINTY</text>
<text x="940.0" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">interval / coverage</text>
<rect x="1100" y="295" width="190" height="120" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1195.0" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">DECISION</text>
<text x="1195.0" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">accept / review / reject</text>
<rect x="1100" y="500" width="190" height="100" rx="16" fill="#FFFFFF" stroke="#8A97A8" stroke-width="2" filter="url(#shadow)"/>
<text x="1195.0" y="534" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">EVIDENCE RECORD</text>
<text x="1195.0" y="562" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">sources + versions</text>
</svg>
