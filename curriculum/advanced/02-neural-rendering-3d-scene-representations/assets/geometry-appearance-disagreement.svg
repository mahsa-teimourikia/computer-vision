<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Photometric agreement does not identify geometry</title>
<desc id="description">A red surface at two metres and another at four metres both render a red pixel, but their expected depths differ and geometry must be evaluated separately.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Photometric agreement does not identify geometry</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">One photometric result, two incompatible spatial explanations</text>
<polyline points="385,280 470,280 470,364 560,364" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="385,505 470,505 470,420 560,420" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="830,392 1010,392" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="862" y="378" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="920" y="395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">evaluate depth</text>
<rect x="110" y="210" width="275" height="140" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="247.5" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">FIELD A</text>
<text x="247.5" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">opaque red density</text>
<text x="247.5" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">at 2 metres</text>
<rect x="110" y="435" width="275" height="140" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="247.5" y="469" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">FIELD B</text>
<text x="247.5" y="497" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">opaque red density</text>
<text x="247.5" y="515" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">at 4 metres</text>
<rect x="560" y="322" width="270" height="140" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="695.0" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SAME RGB</text>
<text x="695.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">PSNR can be equally high</text>
<rect x="1010" y="322" width="280" height="140" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1150.0" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SEPARATE GEOMETRY GATE</text>
<text x="1150.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">2 m ≠ 4 m</text>
<text x="1150.0" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">review or reject</text>
</svg>
