<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Scene representation taxonomy</title>
<desc id="description">Three scene representation families: explicit spatial primitives, implicit coordinate functions, and hybrid learned grids or feature fields.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Scene representation taxonomy</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Choose by downstream query, not by visual novelty</text>
<polyline points="440,348 535,348" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="430" y="333" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="488" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">continuum</text>
<polyline points="865,348 960,348" fill="none" stroke="#8492A6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<rect x="854" y="333" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="912" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">combine</text>
<rect x="110" y="270" width="330" height="155" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="275.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">EXPLICIT</text>
<text x="275.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">points · voxels · meshes</text>
<text x="275.0" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">Gaussian primitives</text>
<rect x="535" y="270" width="330" height="155" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">IMPLICIT</text>
<text x="700.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">occupancy · SDF</text>
<text x="700.0" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">radiance field</text>
<rect x="960" y="270" width="330" height="155" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1125.0" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">HYBRID / LEARNED</text>
<text x="1125.0" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">tensor · hash · feature</text>
<text x="1125.0" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">language-aligned fields</text>
</svg>
