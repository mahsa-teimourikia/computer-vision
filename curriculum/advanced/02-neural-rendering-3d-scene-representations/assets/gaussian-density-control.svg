<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Governed Gaussian density control</title>
<desc id="description">Optimization statistics and primitive state enter a policy that clones small high-gradient Gaussians, splits large high-gradient Gaussians, prunes unsupported primitives, and records lineage.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Governed Gaussian density control</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Topology changes require deterministic thresholds, reasons, and parent lineage</text>
<polyline points="300,350 335,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="555,350 590,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="810,350 845,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1065,350 1100,350" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="285" width="220" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="190.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PRIMITIVE STATE</text>
<text x="190.0" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">gradient · scale · opacity</text>
<rect x="335" y="285" width="220" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="445.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">FROZEN POLICY</text>
<text x="445.0" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">thresholds + budget</text>
<rect x="590" y="285" width="220" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CLONE / SPLIT</text>
<text x="700.0" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">add localized capacity</text>
<rect x="845" y="285" width="220" height="130" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="955.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PRUNE / RESET</text>
<text x="955.0" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">remove or reopen support</text>
<rect x="1100" y="285" width="220" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="1210.0" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">UPDATED SCENE</text>
<text x="1210.0" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">IDs · parents · reasons</text>
</svg>
