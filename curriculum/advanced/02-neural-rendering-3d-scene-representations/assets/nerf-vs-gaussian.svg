<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Implicit fields and explicit Gaussians</title>
<desc id="description">An implicit field is queried along rays while explicit Gaussians are projected into splats; both feed ordered alpha compositing and a rendered image.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Implicit fields and explicit Gaussians</text>
<rect x="64" y="105" width="1272" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Different representations and execution · related front-to-back compositing</text>
<polyline points="340,268 410,268" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="640,268 690,268 690,368 755,368" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="340,518 410,518" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="640,518 690,518 690,418 755,418" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="995,392 1080,392" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="205" width="250" height="125" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="215.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">NERF-STYLE FIELD</text>
<text x="215.0" y="267" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">continuous query function</text>
<rect x="410" y="205" width="230" height="125" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="525.0" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">RAY SAMPLES</text>
<text x="525.0" y="267" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">density + color</text>
<rect x="90" y="455" width="250" height="125" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="215.0" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">GAUSSIAN SET</text>
<text x="215.0" y="517" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">explicit primitives</text>
<rect x="410" y="455" width="230" height="125" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="525.0" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PROJECTED SPLATS</text>
<text x="525.0" y="517" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">elliptical footprints</text>
<rect x="755" y="330" width="240" height="125" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="875.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">ORDERED ALPHA</text>
<text x="875.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">shared compositing form</text>
<rect x="1080" y="330" width="230" height="125" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="1195.0" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">RENDERED IMAGE</text>
<text x="1195.0" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">appearance evidence</text>
</svg>
