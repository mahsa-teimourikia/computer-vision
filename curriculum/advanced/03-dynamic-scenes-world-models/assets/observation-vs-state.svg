<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
<title id="title">Observation is not world state</title>
<desc id="description">A visible frame shows a cart while persistent state also retains velocity, occluded identity, friction context, and actuator delay.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Observation is not world state</text>
<rect x="64" y="105" width="1472" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">A single frame can hide variables required for prediction</text>
<polyline points="530,340 650,340" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="532" y="313" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="590" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">estimate + memory</text>
<polyline points="1030,340 1150,340" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1032" y="313" width="116" height="24" rx="6" fill="#F7F9FC"/>
<text x="1090" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#52606D">predict</text>
<rect x="150" y="250" width="380" height="180" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="340.0" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">VISIBLE OBSERVATION</text>
<text x="340.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">pixels · current detections</text>
<rect x="650" y="230" width="380" height="220" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="840.0" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PERSISTENT WORLD STATE</text>
<text x="840.0" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">visible pose · velocity</text>
<text x="840.0" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">occluded identity · uncertainty</text>
<rect x="1150" y="250" width="300" height="180" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1300.0" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">TASK-RELEVANT FUTURE</text>
<text x="1300.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">position · event · outcome</text>
</svg>
