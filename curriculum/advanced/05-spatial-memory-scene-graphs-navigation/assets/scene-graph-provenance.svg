<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
<title id="title">Scene-graph relation provenance</title>
<desc id="description">Observed or derived relation candidates carry source evidence into deterministic direction, validity, uncertainty, and contradiction checks before becoming versioned graph edges.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1200" height="500" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Scene-graph relation provenance</text>
<rect x="64" y="90" width="1072" height="330" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="124" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Provenance and validity make spatial relations auditable</text>
<polyline points="360,250 470,250" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="730,250 840,250" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="185" width="260" height="130" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="230.0" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">RELATION CANDIDATE</text>
<text x="230.0" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">observed or derived · sources</text>
<rect x="470" y="185" width="260" height="130" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">DETERMINISTIC CHECKS</text>
<text x="600.0" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">direction · inverse · contradiction</text>
<rect x="840" y="185" width="260" height="130" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="970.0" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">VERSIONED EDGE</text>
<text x="970.0" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">valid interval · uncertainty</text>
</svg>
