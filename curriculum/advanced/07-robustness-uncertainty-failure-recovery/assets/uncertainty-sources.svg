<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
<title id="title">Uncertainty sources and evidence</title>
<desc id="description">Aleatoric and epistemic uncertainty motivate practical scores, but a trusted risk policy treats every score as fallible evidence.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="520" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Uncertainty sources and evidence</text>
<rect x="64" y="90" width="1272" height="360" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="124" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Practical methods do not perfectly decompose uncertainty</text>
<polyline points="346,276 416,276" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="666,276 736,276" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="986,276 1056,276" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="96" y="220" width="250" height="112" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="221.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">ALEATORIC</text>
<text x="221.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">observation ambiguity</text>
<rect x="416" y="220" width="250" height="112" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="541.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">EPISTEMIC</text>
<text x="541.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">limited model support</text>
<rect x="736" y="220" width="250" height="112" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="861.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">PRACTICAL SCORES</text>
<text x="861.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">entropy · margin · disagreement</text>
<rect x="1056" y="220" width="250" height="112" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1181.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">RISK DECISION</text>
<text x="1181.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">evidence, not truth</text>
</svg>
