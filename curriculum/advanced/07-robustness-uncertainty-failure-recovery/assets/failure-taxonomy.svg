<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title description">
<title id="title">Failure conditions require different responses</title>
<desc id="description">Eight failure families distinguish corruption, sensor, environment, semantic, temporal, multimodal, ambiguity, and system failures.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="620" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Failure conditions require different responses</text>
<rect x="64" y="90" width="1272" height="460" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="124" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Do not call every failure OOD or solve every failure with the same threshold</text>
<rect x="96" y="180" width="250" height="108" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="221.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CORRUPTION</text>
<text x="221.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">blur · noise · exposure</text>
<rect x="416" y="180" width="250" height="108" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="541.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SENSOR SHIFT</text>
<text x="541.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">camera · resolution · drift</text>
<rect x="736" y="180" width="250" height="108" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="861.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">ENVIRONMENT</text>
<text x="861.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">weather · light · background</text>
<rect x="1056" y="180" width="250" height="108" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="1181.0" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SEMANTIC SHIFT</text>
<text x="1181.0" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">novel class · object</text>
<rect x="96" y="350" width="250" height="108" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="221.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">TEMPORAL SHIFT</text>
<text x="221.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">process changes</text>
<rect x="416" y="350" width="250" height="108" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="541.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">MULTIMODAL</text>
<text x="541.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">missing · contradiction</text>
<rect x="736" y="350" width="250" height="108" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="861.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">AMBIGUITY</text>
<text x="861.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">multiple plausible labels</text>
<rect x="1056" y="350" width="250" height="108" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1181.0" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SYSTEM FAILURE</text>
<text x="1181.0" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">stale · unavailable</text>
</svg>
