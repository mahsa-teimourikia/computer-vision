<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
<title id="title">Selective prediction trade-off</title>
<desc id="description">Always-answer provides full coverage and hidden error; abstention lowers coverage; a frozen cost policy chooses an operating point.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1400" height="520" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Selective prediction trade-off</text>
<rect x="64" y="90" width="1272" height="360" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="124" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">A threshold is a risk decision, not a model-quality metric</text>
<polyline points="364,276 570,276" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="830,276 1036,276" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="104" y="220" width="260" height="112" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="234.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">ALWAYS ANSWER</text>
<text x="234.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">coverage 100%</text>
<rect x="570" y="220" width="260" height="112" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="700.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">SELECTIVE SCORE</text>
<text x="700.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">rank likely errors</text>
<rect x="1036" y="220" width="260" height="112" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1166.0" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">FROZEN POLICY</text>
<text x="1166.0" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">risk · coverage · cost</text>
</svg>
