<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
<title id="title">Action-space taxonomy</title>
<desc id="description">Discrete actions lead to Cartesian deltas, joint commands, end-effector poses, and timed trajectories, with increasingly explicit control semantics.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324F" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="760" fill="#F7F9FC"/>
<text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#16324F">Action-space taxonomy</text>
<rect x="64" y="105" width="1472" height="555" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="86" y="139" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F">Every representation needs a controller, frame, units, bounds, and time base</text>
<polyline points="324,353 390,353" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="620,353 686,353" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="916,353 982,353" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1212,353 1278,353" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="94" y="278" width="230" height="150" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2" filter="url(#shadow)"/>
<text x="209.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">DISCRETE</text>
<text x="209.0" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">left · right · grasp</text>
<rect x="390" y="278" width="230" height="150" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
<text x="505.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">CARTESIAN</text>
<text x="505.0" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">delta position + rotation</text>
<rect x="686" y="278" width="230" height="150" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2" filter="url(#shadow)"/>
<text x="801.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">JOINT</text>
<text x="801.0" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">q or delta q</text>
<rect x="982" y="278" width="230" height="150" rx="16" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="1097.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">POSE</text>
<text x="1097.0" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">position + orientation</text>
<rect x="1278" y="278" width="230" height="150" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2" filter="url(#shadow)"/>
<text x="1393.0" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16324F">TRAJECTORY</text>
<text x="1393.0" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">timed action chunk</text>
</svg>
