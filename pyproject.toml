[project]
name = "computer-vision-field-guide"
version = "0.1.0"
description = "Runnable learning materials for computer vision"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
]

[project.optional-dependencies]
learner = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib==3.11.1",
    "pillow==12.3.0",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
]
contributor = [
    "computer-vision-field-guide[learner]",
    "faiss-cpu==1.15.0",
    "pytest>=8.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
packages = []
