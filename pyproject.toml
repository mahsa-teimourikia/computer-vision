[project]
name = "computer-vision-field-guide"
version = "0.1.0"
description = "Runnable learning materials for computer vision"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
learner = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9,<4",
    "pillow>=11,<13",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
]
contributor = [
    "computer-vision-field-guide[learner]",
    "pytest>=8.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
packages = []
