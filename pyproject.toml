[project]
name = "computer-vision-field-guide"
version = "0.2.0"
description = "Notebook-first learning materials for computer vision, multimodal AI, and spatial intelligence"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.3",
]

[project.optional-dependencies]
learner = [
    "jupyterlab==4.6.4",
    "ipykernel==7.3.0",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "pillow==12.3.0",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
]
course-07 = [
    "faiss-cpu==1.15.1",
]
contributor = [
    "computer-vision-field-guide[learner,course-07]",
    "pytest==9.1.1",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
packages = []
