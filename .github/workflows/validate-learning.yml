name: Validate learning materials

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install contributor tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[contributor]'
          python -m ipykernel install --user --name computer-vision-field-guide --display-name "Computer Vision Field Guide"
      - name: Validate structure and local links
        run: python scripts/validate_structure.py
      - name: Validate deterministic diagrams
        run: |
          python scripts/render_course_diagrams.py curriculum/beginner/01-modern-computer-vision-foundations/assets/specs/*.json
          git diff --exit-code -- curriculum/beginner/01-modern-computer-vision-foundations/assets
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Execute credential-free notebooks
        env:
          PYTHONPATH: .
        run: python scripts/execute_notebooks.py --timeout 300
